version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dealership_postgres
    restart: always
    environment:
      POSTGRES_USER: dealer_admin
      POSTGRES_PASSWORD: dealer_secure_pass
      POSTGRES_DB: dealership_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealer_admin -d dealership_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealership_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dealer_admin:dealer_secure_pass@db:5432/dealership_db
      SECRET_KEY: supersecretjwtkey_change_in_production_min_32_characters_long!
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      INITIAL_ADMIN_EMAIL: admin@apexmotors.com
      INITIAL_ADMIN_PASSWORD: AdminSecurePass2026!
      INITIAL_ADMIN_NAME: Apex Dealership Admin
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dealership_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
